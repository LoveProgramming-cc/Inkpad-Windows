name: Package Inkpad for Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: "Upstream branch, tag, full commit SHA, or pinned"
        default: main
        required: true
        type: string
      publish:
        description: "Publish the verified files in this repository's Releases"
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the installer and portable ZIP
        shell: pwsh
        env:
          UPSTREAM_REVISION: ${{ inputs.revision || 'pinned' }}
        run: |
          $dir = 'D:\InkpadBuild'
          ./packaging/windows/build.ps1 -WorkDir $dir -Revision $env:UPSTREAM_REVISION
          Copy-Item "$dir/source.commit" "$dir/dist/UPSTREAM.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Inkpad-Windows
          path: D:/InkpadBuild/dist/
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Inkpad-Windows
          path: dist
      - name: Publish verified Windows files
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256.txt
          upstream=$(tr -d '\r\n' < UPSTREAM.txt)
          [[ "$upstream" =~ ^[0-9a-f]{40}$ ]]
          tag="windows-${upstream:0:12}-$GITHUB_RUN_NUMBER"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Inkpad for Windows · ${upstream:0:12}" \
            --notes "Upstream source: https://github.com/LoveProgramming-cc/Inkpad-gnome/commit/$upstream" \
            *-Setup.exe *-Portable.zip SHA256.txt UPSTREAM.txt
